CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# Bluetooth central with a GATT client, which is what the SMP client transport drives.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="SMP Client"

# Allow for large Bluetooth data packets, matching what smp_svr asks for in its bt.conf.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# None of the above buys anything until the ATT MTU itself is negotiated up from its
# default of 23, and only the central can ask for that: a peer running smp_svr has no GATT
# client of its own to initiate the exchange. Without this the transport spends the whole
# session writing 20 byte fragments.
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y

# The client transport keeps up to MCUMGR_TRANSPORT_BT_CLIENT_TX_CREDITS write fragments in
# flight and needs an ATT buffer for each of them, with headroom left for everything else
# that shares the link.
CONFIG_BT_ATT_TX_COUNT=4

# MCUmgr SMP client over the Bluetooth central transport.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_SMP_CLIENT=y
CONFIG_MCUMGR_TRANSPORT_BT_CLIENT=y

# The image upload client sizes every upload frame from this without consulting the
# transport MTU, so it must not exceed the peer's own MCUMGR_TRANSPORT_NETBUF_SIZE, which
# is 2475 in the smp_svr sample.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048

CONFIG_MCUMGR_GRP_IMG_CLIENT=y
CONFIG_MCUMGR_GRP_OS_CLIENT=y

# The image management client headers pull in <bootutil/image.h>, and the sample writes an
# MCUboot image header into the placeholder image it creates.
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

# The image to upload is read from a littlefs file system.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
