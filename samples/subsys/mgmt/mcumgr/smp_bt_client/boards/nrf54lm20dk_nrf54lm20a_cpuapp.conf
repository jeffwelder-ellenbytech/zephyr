# The littlefs mount point is on the external SPI flash rather than on a QSPI one.
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# The devicetree node carries a JESD216 basic flash parameters table, so read the flash
# parameters from there instead of synthesising a minimal fixed configuration.
CONFIG_SPI_NOR_SFDP_DEVICETREE=y

# littlefs derives its block size from the flash page layout, and the driver's default
# page size of 64 KiB would leave the 1 MiB partition with too few blocks to be usable.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
