# The littlefs mount point is on the external QSPI flash.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# littlefs derives its block size from the flash page layout, and the default QSPI page
# size of 64 KiB would leave the 1 MiB partition with too few blocks to be usable.
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
