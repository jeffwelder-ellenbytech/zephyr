# Credits must not exceed the ATT transmit buffer count, which a build assertion in
# the transport checks, so raise both together.
CONFIG_BT_ATT_TX_COUNT=16
CONFIG_MCUMGR_TRANSPORT_BT_CLIENT_TX_CREDITS=16
CONFIG_MCUMGR_TRANSPORT_BT_CLIENT_TX_CREDIT_TIMEOUT=10000
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512

# The SMP server transport alongside the client one. This is the configuration the client
# transport exists for: a device that serves SMP to one peer while driving another. The
# server registers itself into the SMP client registry too, so building both is what
# proves the two claim different transport types.
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# Builds the transport's optional name field, which is only compiled when the transport
# management group can report it.
CONFIG_MCUMGR_GRP_TRANSPORT=y
CONFIG_MCUMGR_GRP_TRANSPORT_INFO_FUNCTIONS=y
