CONFIG_ZTEST=y

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_SMP_CLIENT=y

# The Bluetooth host only. The test never calls bt_enable(), and no_hci.overlay removes
# the HCI driver, so no controller is built and no radio is needed.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n

CONFIG_MCUMGR_TRANSPORT_BT_CLIENT=y

# Lets the test observe the buffer pool directly, which is how it proves that the
# transmit path releases the packet it was handed even when it refuses to send it.
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_AVAILABLE=y
