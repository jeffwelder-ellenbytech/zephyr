CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_SMP_CLIENT=y

# Extend the system work queue stack, which is where the stub answers from.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# Lets the test observe the buffer pool directly, which is how it proves that the
# transmit path releases the packet it was handed even when it refuses to send it.
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_AVAILABLE=y

# A test may leave a command outstanding, and its buffer only comes back when the SMP
# client gives up on it, so the pool needs a little more headroom than the default.
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=6
